name: Arduino CI
on: [pull_request]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        name: compile
        with:
          fqbn: "arduino:megaavr:uno2018"
          sketch-paths: |
            - .
          libraries: |
            - name: NewPing
              version: 1.9.7
            - name: LiquidCrystal
              version: 1.0.7
            - name: WiFiNINA
              version: 1.91
            - name: PubSubClient
              version: 2.8.0
          cli-compile-flags: |
            --build-property build.arduino.extra_flags="-DCI_BUILD"

